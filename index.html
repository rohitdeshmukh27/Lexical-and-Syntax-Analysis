<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Schema Analyzer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>JSON Schema Analyzer</h1>

    <div class="section">
      <h2>Input JSON Schema</h2>
      <textarea
        id="jsonInput"
        placeholder="Paste your JSON Schema here..."
      ></textarea>
      <div>
        <button id="analyzeBtn">Analyze</button>
        <button id="sampleBtn">Load Sample</button>
        <button id="clearBtn">Clear</button>
      </div>
    </div>

    <div class="section">
      <h2>Lexical Analysis (Tokens)</h2>
      <div id="tokensOutput" class="output"></div>
    </div>

    <div class="section">
      <h2>Syntax Analysis (AST)</h2>
      <div id="astOutput" class="output"></div>
    </div>

    <div class="section">
      <h2>Validation Results</h2>
      <div id="validationOutput" class="output"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
